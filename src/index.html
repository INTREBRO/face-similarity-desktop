<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别相似度分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(255,255,255,0.3);
        }

        .tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
        }

        .upload-area:hover {
            background: #f5f7ff;
            border-color: #764ba2;
        }

        .upload-area.drag-over {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .images-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .image-box {
            flex: 1;
            text-align: center;
        }

        .image-preview {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
        }

        .similarity-score {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }

        .similarity-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .similarity-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #0abde3);
            transition: width 0.5s;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-text {
            color: #666;
            margin: 10px 0;
        }

        .faces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .face-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .face-card img {
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>🎯 人脸识别相似度分析</h1>
            <p>基于 InsightFace 的高精度人脸识别</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('compare')">📷 照片对比</button>
            <button class="tab" onclick="switchTab('detect')">🔍 人脸检测</button>
            <button class="tab" onclick="switchTab('video')">🎬 视频对比</button>
        </div>

        <div class="content">
            <!-- 照片对比 Tab -->
            <div id="tab-compare" class="tab-content active">
                <h2>上传两张照片进行对比</h2>
                <p class="info-text">支持 JPG、PNG 格式，将自动检测人脸并计算相似度</p>

                <div class="images-container">
                    <div class="image-box">
                        <div class="upload-area" id="upload1" onclick="selectFile(1)">
                            <p>📁 点击或拖拽上传第一张照片</p>
                        </div>
                        <img id="preview1" class="image-preview" style="display:none;">
                    </div>
                    <div class="image-box">
                        <div class="upload-area" id="upload2" onclick="selectFile(2)">
                            <p>📁 点击或拖拽上传第二张照片</p>
                        </div>
                        <img id="preview2" class="image-preview" style="display:none;">
                    </div>
                </div>

                <div style="text-align:center;">
                    <button class="btn btn-primary" id="btn-compare" onclick="comparePhotos()" disabled>
                        🔍 开始对比
                    </button>
                </div>

                <div id="result-compare"></div>
            </div>

            <!-- 人脸检测 Tab -->
            <div id="tab-detect" class="tab-content">
                <h2>检测照片中的人脸</h2>
                <p class="info-text">上传一张照片，自动检测所有人脸并识别年龄、性别</p>

                <div class="upload-area" id="upload-detect" onclick="selectFileDetect()">
                    <p>📁 点击或拖拽上传照片</p>
                </div>
                <img id="preview-detect" class="image-preview" style="display:none;">

                <div style="text-align:center; margin-top:20px;">
                    <button class="btn btn-primary" id="btn-detect" onclick="detectFaces()" disabled>
                        🔍 开始检测
                    </button>
                </div>

                <div id="result-detect"></div>
            </div>

            <!-- 视频对比 Tab -->
            <div id="tab-video" class="tab-content">
                <h2>在视频中搜索目标人脸</h2>
                <p class="info-text">上传目标照片和视频，自动识别视频中是否出现该人物，返回所有命中时间戳</p>

                <div class="images-container">
                    <div class="image-box">
                        <div class="upload-area" id="upload-target" onclick="selectFileVideo(1)">
                            <p>📁 点击上传目标照片</p>
                        </div>
                        <img id="preview-target" class="image-preview" style="display:none;">
                    </div>
                    <div class="image-box">
                        <div class="upload-area" id="upload-video" onclick="selectFileVideo(2)">
                            <p>🎬 点击上传视频文件</p>
                        </div>
                        <p id="video-name" style="margin-top:10px; color:#666;"></p>
                    </div>
                </div>

                <div style="text-align:center; margin:20px 0;">
                    <label style="margin-right:15px;">
                        相似度阈值: <input type="number" id="threshold" value="0.4" min="0" max="1" step="0.05" style="width:60px; padding:5px; border:1px solid #ddd; border-radius:5px;">
                    </label>
                    <label>
                        采样间隔(帧): <input type="number" id="sample-interval" value="30" min="1" max="300" style="width:70px; padding:5px; border:1px solid #ddd; border-radius:5px;">
                    </label>
                </div>

                <!-- 进度条 -->
                <div id="video-progress" style="display:none; margin:20px 0;">
                    <div style="display:flex; align-items:center; gap:15px; margin-bottom:10px;">
                        <span id="progress-label" style="min-width:120px; color:#667eea; font-size:14px;">正在加载...</span>
                        <span id="progress-percent" style="min-width:50px; color:#333; font-weight:bold;">0%</span>
                    </div>
                    <div style="height:12px; background:#e0e0e0; border-radius:6px; overflow:hidden;">
                        <div id="progress-bar" style="height:100%; background:linear-gradient(90deg,#667eea,#764ba2); border-radius:6px; transition:width 0.3s; width:0%;"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-top:8px;">
                        <span id="progress-detail" style="font-size:12px; color:#888;"></span>
                        <span id="progress-match" style="font-size:12px; color:#0abde3;"></span>
                    </div>
                </div>

                <div style="text-align:center;">
                    <button class="btn btn-primary" id="btn-video" onclick="compareVideo()" disabled>
                        🎬 开始分析视频
                    </button>
                </div>

                <!-- 报告导出区 -->
                <div id="report-section" style="display:none; margin-top:20px; text-align:center; padding:20px; background:#f5f7ff; border-radius:10px;">
                    <p style="margin-bottom:15px; color:#667eea; font-weight:bold;">✅ 分析完成！</p>
                    <button class="btn btn-primary" onclick="exportReport()">
                        📥 导出分析报告 (HTML)
                    </button>
                    <button class="btn" onclick="exportReportData()" style="background:#eee; color:#333; margin-left:10px;">
                        📊 导出数据 (JSON)
                    </button>
                </div>

                <div id="result-video"></div>
            </div>
        </div>
    </div>

    <script>
        let file1 = null;
        let file2 = null;
        let fileDetect = null;
        let fileTarget = null;
        let fileVideo = null;

        // 切换 Tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // 选择文件（照片对比 - 图1）
        async function selectFile(num) {
            const result = await window.electronAPI.openFileDialog({
                properties: ['openFile'],
                filters: [
                    { name: '图片', extensions: ['jpg', 'jpeg', 'png', 'bmp'] }
                ]
            });

            if (!result.canceled && result.filePaths.length > 0) {
                const filePath = result.filePaths[0];
                
                if (num === 1) {
                    file1 = filePath;
                    const preview = document.getElementById('preview1');
                    preview.src = filePath;
                    preview.style.display = 'block';
                    document.getElementById('upload1').style.display = 'none';
                } else {
                    file2 = filePath;
                    const preview = document.getElementById('preview2');
                    preview.src = filePath;
                    preview.style.display = 'block';
                    document.getElementById('upload2').style.display = 'none';
                }

                // 两张都选了才启用按钮
                document.getElementById('btn-compare').disabled = !(file1 && file2);
            }
        }

        // 选择文件（人脸检测）
        async function selectFileDetect() {
            const result = await window.electronAPI.openFileDialog({
                properties: ['openFile'],
                filters: [
                    { name: '图片', extensions: ['jpg', 'jpeg', 'png', 'bmp'] }
                ]
            });

            if (!result.canceled && result.filePaths.length > 0) {
                fileDetect = result.filePaths[0];
                const preview = document.getElementById('preview-detect');
                preview.src = fileDetect;
                preview.style.display = 'block';
                document.getElementById('upload-detect').style.display = 'none';
                document.getElementById('btn-detect').disabled = false;
            }
        }

        // 对比两张照片
        async function comparePhotos() {
            if (!file1 || !file2) return;

            const resultDiv = document.getElementById('result-compare');
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在分析中...</p>
                </div>
            `;

            try {
                const data = await window.electronAPI.uploadFile('/compare/photos', [
                    { fieldName: 'file1', filePath: file1 },
                    { fieldName: 'file2', filePath: file2 }
                ]);
                console.log('后端返回:', data);

                if (!data || typeof data !== 'object') {
                    throw new Error('后端返回数据格式错误');
                }

                if (data.error) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ 错误</h3>
                            <p>${data.error}</p>
                        </div>
                    `;
                } else if (typeof data.similarity !== 'number') {
                    throw new Error(`相似度数据缺失，返回内容: ${JSON.stringify(data)}`);
                } else {
                    const score = data.similarity;
                    const percent = data.similarity_percent || `${(score * 100).toFixed(2)}%`;
                    const result = data.result || '未知结果';

                    let color = '#ff6b6b';
                    if (score >= 0.6) color = '#0abde3';
                    else if (score >= 0.4) color = '#feca57';

                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ 对比结果</h3>
                            <div class="similarity-score" style="color:${color}">${percent}</div>
                            <div class="similarity-bar">
                                <div class="similarity-fill" style="width:${score * 100}%"></div>
                            </div>
                            <p style="font-size:20px; font-weight:bold; color:${color}">${result}</p>
                            <p>相似度分数: ${score.toFixed(4)}</p>
                            <p style="margin-top:15px; color:#666;">
                                💡 参考标准: ≥0.6 极有可能同一人 | 0.4~0.6 可能同一人 | &lt;0.4 不是同一人
                            </p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ 请求失败</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // 检测人脸
        async function detectFaces() {
            if (!fileDetect) return;

            const resultDiv = document.getElementById('result-detect');
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在检测中...</p>
                </div>
            `;

            try {
                const data = await window.electronAPI.uploadFile('/detect', [
                    { fieldName: 'file', filePath: fileDetect }
                ]);

                if (data.error) {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ 错误</h3>
                            <p>${data.error}</p>
                        </div>
                    `;
                } else {
                    let facesHTML = '';
                    data.faces.forEach((face, idx) => {
                        facesHTML += `
                            <div class="face-card">
                                <h4>人脸 #${idx + 1}</h4>
                                <p>年龄: ${face.age} 岁</p>
                                <p>性别: ${face.gender}</p>
                                <p>位置: [${face.bbox.map(c => c.toFixed(0)).join(', ')}]</p>
                            </div>
                        `;
                    });

                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ 检测完成</h3>
                            <p>共检测到 <strong>${data.count}</strong> 张人脸</p>
                            <div class="faces-grid">
                                ${facesHTML}
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ 请求失败</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // 选择文件（视频对比）
        async function selectFileVideo(num) {
            const filters = num === 1
                ? [{ name: '图片', extensions: ['jpg', 'jpeg', 'png', 'bmp'] }]
                : [{ name: '视频', extensions: ['mp4', 'avi', 'mov', 'mkv', 'wmv'] }];

            const result = await window.electronAPI.openFileDialog({
                properties: ['openFile'],
                filters: filters
            });

            if (!result.canceled && result.filePaths.length > 0) {
                const filePath = result.filePaths[0];

                if (num === 1) {
                    fileTarget = filePath;
                    const preview = document.getElementById('preview-target');
                    preview.src = filePath;
                    preview.style.display = 'block';
                    document.getElementById('upload-target').style.display = 'none';
                } else {
                    fileVideo = filePath;
                    document.getElementById('video-name').textContent = filePath.split('/').pop().split('\\').pop();
                    document.getElementById('upload-video').querySelector('p').textContent = '✅ 已选择视频';
                }

                document.getElementById('btn-video').disabled = !(fileTarget && fileVideo);
            }
        }

        // ─── SSE 视频对比（带实时进度）───
        async function compareVideo() {
            if (!fileTarget || !fileVideo) return;

            const threshold = document.getElementById('threshold').value;
            const sampleInterval = document.getElementById('sample-interval').value;
            const btn = document.getElementById('btn-video');
            const progressDiv = document.getElementById('video-progress');
            const reportSection = document.getElementById('report-section');
            const resultDiv = document.getElementById('result-video');

            // 重置状态
            btn.disabled = true;
            btn.textContent = '⏳ 分析中...';
            progressDiv.style.display = 'block';
            reportSection.style.display = 'none';
            resultDiv.innerHTML = '';
            window.lastVideoResult = null;

            // 更新进度条
            function updateProgress(data) {
                const percent = Math.min(data.percent || 0, 100);
                document.getElementById('progress-bar').style.width = percent + '%';
                document.getElementById('progress-percent').textContent = percent + '%';
                document.getElementById('progress-label').textContent = data.message || '处理中...';
                if (data.frame && data.total_frames) {
                    document.getElementById('progress-detail').textContent = `帧: ${data.frame}/${data.total_frames}`;
                }
                if (data.matches !== undefined) {
                    document.getElementById('progress-match').textContent = `匹配: ${data.matches}`;
                }
            }

            try {
                // 视频对比使用 SSE，仍需用 fetch，但文件通过主进程读取
                const formData = new FormData();
                const bytesTarget = await window.electronAPI.readFile(fileTarget);
                const bytesVideo = await window.electronAPI.readFile(fileVideo);
                const blobTarget = new Blob([new Uint8Array(bytesTarget)]);
                const blobVideo = new Blob([new Uint8Array(bytesVideo)]);
                formData.append('target', blobTarget, await window.electronAPI.pathBasename(fileTarget));
                formData.append('video', blobVideo, await window.electronAPI.pathBasename(fileVideo));
                formData.append('threshold', threshold);
                formData.append('sample_interval', sampleInterval);

                const response = await fetch('http://localhost:8000/compare/video-sse', {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 保留不完整行

                    for (const line of lines) {
                        if (line.startsWith('event:')) {
                            const eventType = line.replace('event:', '').trim();
                            continue;
                        }
                        if (line.startsWith('data:')) {
                            const dataStr = line.replace('data:', '').trim();
                            try {
                                const data = JSON.parse(dataStr);

                                if (data.error) {
                                    resultDiv.innerHTML = `
                                        <div class="result error">
                                            <h3>❌ 错误</h3><p>${data.error}</p>
                                        </div>`;
                                    return;
                                }

                                if (data.step === 'result') {
                                    // 保存结果用于导出
                                    window.lastVideoResult = data;
                                    renderVideoResult(data);
                                    progressDiv.style.display = 'none';
                                    reportSection.style.display = 'block';
                                } else {
                                    updateProgress(data);
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ 请求失败</h3><p>${error.message}</p>
                    </div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🎬 开始分析视频';
            }
        }

        // 渲染视频对比结果
        function renderVideoResult(data) {
            const resultDiv = document.getElementById('result-video');
            let matchesHTML = '';
            if (data.matches && data.matches.length > 0) {
                data.matches.forEach((m, i) => {
                    const color = m.similarity >= 0.6 ? '#0abde3' : '#feca57';
                    matchesHTML += `
                        <div class="face-card" style="border-left:4px solid ${color}">
                            <h4>匹配 #${i + 1}</h4>
                            <p>⏱️ <strong>${m.time_str}</strong></p>
                            <p>📊 帧号: ${m.frame}</p>
                            <p>🎯 <strong style="color:${color}">${m.similarity_percent}</strong></p>
                        </div>`;
                });
            }

            const summaryColor = data.total_matches > 0 ? '#0abde3' : '#ff6b6b';
            resultDiv.innerHTML = `
                <div class="result ${data.total_matches > 0 ? 'success' : 'error'}" style="margin-top:15px;">
                    <p>视频时长: ${data.video_duration}s | FPS: ${data.video_fps} | 总帧数: ${data.total_frames}</p>
                    <p style="font-size:20px; color:${summaryColor}; margin-top:10px;">
                        ${data.total_matches > 0
                            ? `🎯 共找到 <strong>${data.total_matches}</strong> 处匹配`
                            : '❌ 视频中未找到目标人物'}
                    </p>
                    ${data.total_matches > 0 ? `
                        <div class="faces-grid" style="margin-top:15px;">${matchesHTML}</div>
                    ` : ''}
                </div>`;
        }

        // 导出 HTML 报告
        async function exportReport() {
            const data = window.lastVideoResult;
            if (!data) return alert('请先完成分析');

            try {
                const formData = new FormData();
                formData.append('total_matches', data.total_matches);
                formData.append('video_duration', data.video_duration);
                formData.append('video_fps', data.video_fps);
                formData.append('total_frames', data.total_frames);
                formData.append('sample_interval', data.sample_interval);
                formData.append('threshold', data.threshold);
                formData.append('matches_json', JSON.stringify(data.matches || []));

                const response = await fetch('http://localhost:8000/export/report', {
                    method: 'POST',
                    body: formData
                });

                const html = await response.text();
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `人脸分析报告_${new Date().toISOString().slice(0,10)}.html`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('导出失败: ' + e.message);
            }
        }

        // 导出 JSON 数据
        function exportReportData() {
            const data = window.lastVideoResult;
            if (!data) return alert('请先完成分析');
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `人脸分析数据_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
